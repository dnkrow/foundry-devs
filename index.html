<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#eef1ee" />

    <title>Foundry Devs — Développement web en renfort pour agences</title>
    <meta
      name="description"
      content="Équipe de développeurs full-stack à Toulouse. Renfort technique et sous-traitance en marque blanche pour agences et ESN : React, Next.js, TypeScript, Python, IA."
    />

    <!-- Domaine définitif. Répercuter tout changement dans robots.txt,
         sitemap.xml et src/data/site.ts. -->
    <link rel="canonical" href="https://foundrydevs.codes/" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Safari ignore le SVG ici : ce doit être un PNG, sinon iOS place une
         vignette de la page sur l'écran d'accueil. Régénéré par `npm run images`
         depuis scripts/apple-touch-icon.svg. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Visuel du hero : c'est le LCP, on le demande avant tout le reste. -->
    <link
      rel="preload"
      as="image"
      type="image/avif"
      href="/assets/hero-1600.avif"
      imagesrcset="/assets/hero-640.avif 640w, /assets/hero-1024.avif 1024w, /assets/hero-1600.avif 1600w, /assets/hero-2048.avif 2048w"
      imagesizes="100vw"
      fetchpriority="high"
    />

    <!-- Polices du chemin critique : toutes trois apparaissent dans le hero. -->
    <link
      rel="preload"
      href="/fonts/schibsted-grotesk-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/inter-tight-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/instrument-serif-latin-400-italic.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:site_name" content="Foundry Devs" />
    <meta
      property="og:title"
      content="Foundry Devs — Développement web en renfort pour agences"
    />
    <meta
      property="og:description"
      content="Votre agence vend. Nous construisons. Équipe de développeurs full-stack en renfort ou en marque blanche pour les agences et les équipes produit."
    />
    <meta property="og:url" content="https://foundrydevs.codes/" />
    <meta
      property="og:image"
      content="https://foundrydevs.codes/og.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Foundry Devs — studio de développement indépendant, Toulouse."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Foundry Devs — Développement web en renfort pour agences"
    />
    <meta
      name="twitter:description"
      content="Votre agence vend. Nous construisons. Équipe de développeurs full-stack en renfort ou en marque blanche pour les agences et les équipes produit."
    />
    <meta
      name="twitter:image"
      content="https://foundrydevs.codes/og.jpg"
    />

    <!--
      Données structurées limitées aux informations réellement connues :
      ni adresse postale, ni téléphone, ni note client tant qu'ils ne sont pas
      fournis. Pas de bureau — l'équipe travaille à distance — donc pas
      d'`address` : une adresse inventée ferait plus de mal que son absence.
      Reste à ajouter : `sameAs`, le jour où le collectif aura ses propres
      profils (LinkedIn d'agence, organisation GitHub). Les comptes personnels
      des membres n'y ont pas leur place, ils décrivent d'autres entités.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "Foundry Devs",
        "description": "Collectif de développeurs full-stack indépendants à Toulouse. Renfort technique et sous-traitance en marque blanche pour les agences web et les ESN : applications, API et back-end, intégration IA.",
        "url": "https://foundrydevs.codes/",
        "email": "devsfoundry@gmail.com",
        "areaServed": { "@type": "City", "name": "Toulouse" },
        "knowsLanguage": "fr",
        "serviceType": [
          "Développement web",
          "Sous-traitance de développement web",
          "Développement en marque blanche",
          "Renfort d'équipe de développement",
          "Développement d'applications",
          "Intégration d'intelligence artificielle",
          "Développement d'API et back-end"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 1.5rem; font-family: system-ui">
        Ce site utilise JavaScript pour l’affichage. Écrivez-nous directement
        pour nous joindre.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
