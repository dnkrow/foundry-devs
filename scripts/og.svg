<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!--
    Image de partage social.

    Aucun texte n'est rendu en police : le rasteriseur n'a pas accès aux polices
    du site. Le monogramme et le libellé sont donc des tracés vectoriels, ce qui
    garantit un rendu identique partout. À remplacer par un recadrage du visuel
    définitif une fois celui-ci disponible.
  -->
  <defs>
    <linearGradient id="stone" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#F3F5F2" />
      <stop offset="55%" stop-color="#E4E8E4" />
      <stop offset="100%" stop-color="#CFD6D1" />
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="34" />
    </filter>
    <clipPath id="arch">
      <path d="M 830 630 L 830 300 A 160 160 0 0 1 1150 300 L 1150 630 Z" />
    </clipPath>
  </defs>

  <rect width="1200" height="630" fill="url(#stone)" />

  <g opacity="0.26" filter="url(#soft)" transform="rotate(-20 400 220)">
    <ellipse cx="240" cy="130" rx="150" ry="32" fill="#5C6A63" />
    <ellipse cx="360" cy="205" rx="110" ry="25" fill="#5C6A63" />
    <ellipse cx="170" cy="280" rx="86" ry="20" fill="#5C6A63" />
  </g>

  <g clip-path="url(#arch)">
    <rect x="830" y="0" width="320" height="630" fill="#DFE4E0" />
    <ellipse cx="990" cy="600" rx="200" ry="110" fill="#173D33" opacity="0.2" filter="url(#soft)" />
  </g>

  <path d="M 0 470 L 700 440 L 700 630 L 0 630 Z" fill="#E9EDE9" />
  <rect x="699" y="440" width="2" height="190" fill="#315E50" opacity="0.5" />

  <!-- Monogramme « FD », tracés vectoriels. -->
  <g transform="translate(96 96)">
    <rect width="112" height="112" rx="12" fill="#173D33" />
    <g transform="translate(6 6) scale(1.5625)">
      <path d="M13 19h17v5.4H18.6v6H27v5.4h-8.4V45H13z" fill="#EEF1EE" />
      <path d="M34 19h9.2c6.6 0 10.8 5.1 10.8 13s-4.2 13-10.8 13H34zm5.6 5.4v15.2h3.2c3.5 0 5.6-2.9 5.6-7.6s-2.1-7.6-5.6-7.6z" fill="#8FBFAE" fill-rule="evenodd" />
    </g>
  </g>

  <!-- Barres typographiques : suggèrent le bloc de titre sans police. -->
  <g transform="translate(96 300)">
    <rect width="470" height="26" rx="2" fill="#18201E" />
    <rect y="52" width="360" height="26" rx="2" fill="#18201E" />
    <rect x="372" y="52" width="112" height="26" rx="2" fill="#315E50" />
    <rect y="128" width="250" height="8" rx="2" fill="#5A6560" opacity="0.55" />
    <rect y="152" width="190" height="8" rx="2" fill="#5A6560" opacity="0.55" />
  </g>

  <rect x="96" y="524" width="64" height="2" fill="#315E50" />
</svg>
